name: Validate workflow components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: node --test tests/*.test.mjs

  capture:
    # Pull request merge refs are not valid publish refs. Unit tests still run on PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      artifact: ${{ steps.capture.outputs.artifact }}
    steps:
      - name: Capture a simulated push (no registry access)
        id: capture
        uses: $/actions/capture-image-v1
        with:
          digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          tags: |-
            ghcr.io/example/image:42
            ghcr.io/example/image:latest
          version: '42'
        env:
          SERVICES_PUBLISH_IDENTITY_VERSION: '1'

  restore:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify the cross-job artifact without checking out code
        id: restore
        uses: $/actions/restore-image-v1
        with:
          artifact: ${{ needs.capture.outputs.artifact }}
      - name: Check the simulated publication
        shell: bash
        env:
          PAYLOAD_PATH: ${{ steps.restore.outputs.path }}
        run: |
          jq -e --arg id "$GITHUB_REPOSITORY_ID" '
            .schemaVersion == 1 and
            .sourceRepositoryId == $id and
            .repository == "ghcr.io/example/image" and
            .version == "42" and
            .digest == ("sha256:" + ("a" * 64)) and
            .tags == ["42", "latest"]
          ' "$PAYLOAD_PATH" >/dev/null

  android_smoke:
    if: github.event_name == 'workflow_dispatch'
    uses: $/.github/workflows/build-android-v1.yml
    permissions:
      contents: read
    with:
      build-script: tests/fixtures/native-build/android.sh
      version: '0.1.42'
      artifact-name: native-android-smoke
      artifact-path: dist/android

  windows_smoke:
    if: github.event_name == 'workflow_dispatch'
    uses: $/.github/workflows/build-windows-v1.yml
    permissions:
      contents: read
    with:
      build-script: tests/fixtures/native-build/windows.ps1
      version: '0.1.42'
      artifact-name: native-windows-smoke
      artifact-path: dist/windows

  native_artifact_smoke:
    needs: [android_smoke, windows_smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-android-smoke
          path: readback/android
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-windows-smoke
          path: readback/windows
      - name: Verify both fixture artifacts match the caller
        shell: bash
        run: |
          for platform in android windows; do
            printf '%s\n' "$platform 0.1.42 $GITHUB_SHA" | diff - "readback/$platform/build.txt"
          done
